<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход</title>
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', path='/images/logo.ico') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='/styles/login.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <form action="/auth/login", method="post">
        <img src="{{ url_for('static', path='/images/logo.png') }}" alt="">
        <h1>Вход</h1>
        <p>Логин</p>
        <input type="text" id="user" name="login">
        <p>Пароль</p>
        <input type="password" id="password" name="password">
        {% if not user_exist: %}
        <p class="error">Неверный логин или пароль</p>
        {% endif %}
        <button type="submit">Войти</button>
    </form>
</body>
</html>
